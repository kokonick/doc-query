                            </tr>
                            <tr th:if="${#lists.isEmpty(documents)}">

                            </tr>
                            </tbody>
                        </table>

<th:block th:replace="~{layout/main-template :: docquery_script}"></th:block>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const selectAllCheckbox = document.getElementById("selectAll");
        const rowCheckboxes = document.querySelectorAll(".row-checkbox");
        const bulkDeleteBtn = document.getElementById("btnBulkDelete");
        const selectedCountSpan = document.getElementById("selectedCount");

        // Function to update the visibility and counter of the bulk button
        function updateBulkButton() {
            const checkedCount = document.querySelectorAll(".row-checkbox:checked").length;

            if (checkedCount > 0) {
                bulkDeleteBtn.classList.remove("d-none");
                selectedCountSpan.textContent = checkedCount;
            } else {
                bulkDeleteBtn.classList.add("d-none");
            }

            // Sync Master checkbox state if all rows are manually ticked
            selectAllCheckbox.checked = (checkedCount === rowCheckboxes.length && rowCheckboxes.length > 0);
        }

        // Master "Select All" event logic
        selectAllCheckbox.addEventListener("change", function () {
            rowCheckboxes.forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
            });
            updateBulkButton();
        });

        // Individual row event logic
        rowCheckboxes.forEach(checkbox => {
            checkbox.addEventListener("change", updateBulkButton);
        });
    });

    // Mock processing utility (Example endpoint connector)
    function processSelectedRows() {
        const selectedIds = Array.from(document.querySelectorAll(".row-checkbox:checked"))
            .map(cb => cb.value);

        if (selectedIds.length > 0) {
            //alert("Sending Selected record IDs to backend: " + JSON.stringify(selectedIds));
            const userResponse = confirm("Are you sure you want to delete selected documents?");
            if (userResponse) {
                const form = document.getElementById('docFormList');
                form.submit();
            }
        }
    }
</script>
