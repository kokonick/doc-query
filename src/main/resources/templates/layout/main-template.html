<!DOCTYPE html>
<html>
<head >
	<th:block th:fragment="html_head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS v5.3.8 -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	</th:block>
    
    <title>Ezbet Home</title>
</head>
<body>

	<div class="navbar navbar-inverse navbar-fixed-top"
		th:fragment="header"></div>

	<div class="alert alert-dismissable"
		th:fragment="alert (type, message)"
		th:assert="${!#strings.isEmpty(type) and !#strings.isEmpty(message)}"
		th:classappend="'alert-' + ${type}">
		<button type="button" class="close" data-dismiss="alert"
			aria-hidden="true">&times;</button>
		<span th:text="${message}">Test</span>
	</div>

	<!-- Footer -->
	<footer class="bg-dark text-white mt-auto py-3" th:fragment="footer">
		<div class="container text-center">
			<p>&copy; 2026 MyApp. Built with
				[Bootstrap](https://getbootstrap.com/) v5.3.3.</p>
		</div>
	</footer>
	
	<th:block th:fragment="docquery_script">
	<!-- Bootstrap JavaScript Bundle with Popper v5.3.x -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
			
	</th:block>
	</body>
</html>
