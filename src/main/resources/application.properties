spring.application.name=doc-query

app.version=@project.version@
logging.level.org.springframework=INFO

# Errors
spring.web.error.include-exception=true
spring.web.error.include-stacktrace=always

spring.datasource.url=jdbc:sqlite:document-query-db.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Max file size for a single upload
spring.servlet.multipart.max-file-size=1MB
# Max request size total for multipart requests
spring.servlet.multipart.max-request-size=1MB
# Custom property defining where files should save
#app.upload.dir=./uploads

spring.sql.init.continue-on-error=false
#logging.level.org.springframework.boot.sql.init=INFO
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:data/db-init.sql
